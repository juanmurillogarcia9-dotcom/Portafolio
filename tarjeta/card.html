<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Document</title>
</head>

<body>

    <div class="card">
        <img id="avatar" alt="">
        <p class="texto">My name is</p>
        <h1 id="nombre"></h1>
        <h4 id="persona">Soy una persona muy alegre</h4>
        <div class="info">
            <p>📧 <span id="correo"></span></p>
            <p>📞 <span id="telefono"></span></p>
            <p>📍 <span id="direccion"></span></p>
        </div>
        <div class="info">
            ...
        </div>
        <button id="btn">Ver Perfil</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            let res = await axios.get("https://randomuser.me/api/")
            console.log(res);
            let nombre = document.getElementById("nombre")
            let imagen = document.getElementById("avatar")

            nombre.textContent = res.data.results[0].name.first
            imagen.src = res.data.results[0].picture.large
            let correo = document.getElementById("correo");
            let telefono = document.getElementById("telefono");
            let direccion = document.getElementById("direccion");

            correo.textContent = res.data.results[0].email;
            telefono.textContent = res.data.results[0].phone;
            direccion.textContent =
                res.data.results[0].location.city + ", " +
                res.data.results[0].location.country;

        })

    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e7d2d2;
        }

        .card {
            width: 420px;
            min-height: 650px;
            background: rgb(85, 164, 230);
            border-radius: 15px;
            padding: 100px 30px 40px;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .3);
        }

        .info {
            margin-top: 25px;
            text-align: left;
        }


        .info p {
            margin: 12px 0;
            background: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            color: #333;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #1f4b8f;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #da680a;
        }

        .card p {
            text-align: center;
            font-style: italic;
            font-size: 14px;
        }

        .card h4 {
            text-align: center;
            font-style: italic;
            color: white;
            font-size: 20px;
            margin-top: -10px;
        }



        #nombre {
            margin-top: 10px;
            font-size: 45px;
            color: #160707;
        }

        .texto {
            margin-top: 5px;
            color: rgb(19, 14, 14);
            font-size: 45px;

        }


        #avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            margin-top: 30px;
            margin-bottom: 15px;
        }
    </style>






</body>


</html>
