<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .detalle-card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .detalle-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid black;
        }

        .info-group {
            text-align: left;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .info-group p {
            margin: 8px 0;
            color: #444;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff0808;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .btn-volver:hover {
            background-color: #6b514a;
        }

        .star {
            display: inline-block;
            font-size: 28px;
            color: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            user-select: none;
            margin-left: 12px;
            vertical-align: middle;
        }

        .star.active {
            color: #ffb400;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .2)
        }
    </style>
</head>

<body>

    <div class="detalle-card" id="detalle-container">

    </div>

    <script>
        const contenedor = document.getElementById("detalle-container");

        // Recuperar los datos del usuario desde localStorage
        const usuarioGuardado = localStorage.getItem("usuarioSeleccionado");

        if (usuarioGuardado) {
            const usuario = JSON.parse(usuarioGuardado);

            contenedor.innerHTML = `
                <img src="${usuario.picture.large}" alt="Foto de ${usuario.name.first}">
                <h2>${usuario.name.title} ${usuario.name.first} ${usuario.name.last} <span id="favStar" class="star">★</span></h2>
                
                <div class="info-group">
                    <p><strong>Género:</strong> ${usuario.gender}</p>
                    <p><strong>Edad:</strong> ${usuario.dob.age} años (Nacimiento: ${usuario.dob.date.split('T')[0]})</p>
                    <p><strong>Email:</strong> ${usuario.email}</p>
                    <p><strong>Teléfono:</strong> ${usuario.phone}</p>
                    <p><strong>Celular:</strong> ${usuario.cell}</p>
                    <p><strong>País:</strong> ${usuario.location.country}</p>
                    <p><strong>Ciudad:</strong> ${usuario.location.city}</p>
                    <p><strong>Dirección:</strong> ${usuario.location.street.name} #${usuario.location.street.number}</p>
                    <p><strong>Nombre de Usuario:</strong> ${usuario.login.username}</p>
                </div>

                <a href="index.html" class="btn-volver">Volver al listado</a>
            `;
            // Después de renderizar, sincronizar la estrella con favoritos en localStorage
            const favStar = document.getElementById('favStar');
            const favoritos = JSON.parse(localStorage.getItem('favoritos') || '[]');
            const isFav = favoritos.some(f => f.login && f.login.uuid === usuario.login.uuid);
            if (isFav) favStar.classList.add('active');
            favStar.addEventListener('click', (e) => {
                e.preventDefault();
                let favs = JSON.parse(localStorage.getItem('favoritos') || '[]');
                const idx = favs.findIndex(f => f.login && f.login.uuid === usuario.login.uuid);
                if (idx === -1) {
                    favs.push(usuario);
                    favStar.classList.add('active');
                } else {
                    favs.splice(idx, 1);
                    favStar.classList.remove('active');
                }
                localStorage.setItem('favoritos', JSON.stringify(favs));
            });
        } else {
            contenedor.innerHTML = `
                <p>No se encontró información del usuario.</p>
                <a href="index.html" class="btn-volver">Volver al listado</a>
            `;
        }
    </script>
</body>

</html>
